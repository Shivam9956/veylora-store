{% extends 'store/base.html' %}

{% block title %}404 — Page Not Found — Veylora{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 5rem 1.5rem; max-width: 600px; margin: 3rem auto;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 1rem;">404</div>
  <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem;">Page Not Found</h1>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="{% url 'store:home' %}" class="btn btn-primary btn-md">Return Home</a>
    <a href="{% url 'store:product_list' %}" class="btn btn-secondary btn-md">Browse Catalog</a>
  </div>
</div>
{% endblock %}
